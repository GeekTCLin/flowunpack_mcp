[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flowunpack"
dynamic = ["version"]
description = "TCP 流二进制协议结构启发式检测（长度前缀识别 / 自动分帧 / 字段语义标注 / 状态机推断），可作为 MCP 服务供 LLM 客户端调用"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "flowunpack contributors" }]
keywords = ["pcap", "wireshark", "tcp", "protocol", "reverse-engineering", "mcp", "unpack", "framing", "protocol-analysis"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/GeekTCLin/flowunpack_mcp"
Repository = "https://github.com/GeekTCLin/flowunpack_mcp"
Issues = "https://github.com/GeekTCLin/flowunpack_mcp/issues"
Changelog = "https://github.com/GeekTCLin/flowunpack_mcp/blob/main/CHANGELOG.md"

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
pcap = ["scapy>=2.4.5"]
dev = ["pytest>=7.0", "mcp>=1.0", "scapy>=2.4.5"]

[project.scripts]
flowunpack = "flowunpack.__main__:main"
flowunpack-mcp = "flowunpack_mcp.server:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "flowunpack.__version__.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "--deselect tests/smoke_mcp_stdio.py"
